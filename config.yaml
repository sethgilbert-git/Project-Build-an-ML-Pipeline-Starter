main:
  components_repository: components
  project_name: nyc_airbnb
  experiment_name: sample1
  steps: all
  env_manager: local
etl:
  sample: sample1.csv
  min_price: 10.0
  max_price: 350.0
  min_longitude: -74.25
  max_longitude: -73.5
  min_latitude: 40.5
  max_latitude: 41.2
artifacts:
  raw_name: sample.csv
  raw_type: raw_data
  raw_description: Raw NYC Airbnb sample
  raw_input: sample.csv:latest
  clean_name: clean_sample.csv
  clean_type: clean_sample
  clean_description: Price-cleaned NYC Airbnb sample
  clean_compatibility_name: clean_data.csv
  clean_input: clean_sample.csv:latest
  reference: clean_sample.csv:reference
  trainval: trainval_data.csv:latest
  test: test_data.csv:latest
  model_name: random_forest_export
  production_model: random_forest_export:prod
data_check:
  kl_threshold: 0.2
modeling:
  test_size: 0.2
  val_size: 0.2
  random_seed: 42
  stratify_by: neighbourhood_group
  max_tfidf_features: 5
  comparison_relative_tolerance: 0.15
  random_forest:
    n_estimators: 200
    max_depth: 50
    min_samples_split: 4
    min_samples_leaf: 3
    n_jobs: 2
    criterion: squared_error
    max_features: 0.5
    oob_score: true
hydra:
  job:
    chdir: false
